[project]
name = "operations-agent"
version = "0.1.0"
description = "MMK Betriebsagent: Auftragsverwaltung (Strang C) und Deep-Agent-Ausführung mit Betriebswerkzeugen (Strang D)"
requires-python = ">=3.12,<3.13"
# Exakte Pins, Änderungen nur über Strang D (C meldet Abhängigkeiten an D).
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.7",
    "langchain-openai==1.7.3",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]==3.3.6",
    "kubernetes==37.0.1",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    # Strang C: Ereigniseingang, Auftragsverwaltung, CLI ops
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
ops-agent-prototype = "agent.prototype:main"
ops = "persistence.cli:main"
ops-api = "api.__main__:main"
ops-worker = "worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/tools", "src/contracts", "src/api", "src/persistence", "src/worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "I", "B"]
