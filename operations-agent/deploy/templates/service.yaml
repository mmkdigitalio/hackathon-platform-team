apiVersion: v1
kind: Service
metadata:
  name: {{ include "ops.name" . }}
  labels: {{- include "ops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ops.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
