# Läuft vor neuen API-/Worker-Pods genau einmal je Install/Upgrade. Nutzt bewusst nicht den
# ServiceAccount des Charts: der existiert bei pre-install noch nicht und wird hier nicht gebraucht.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ops.name" . }}-migrate
  labels: {{- include "ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ops.name" . }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "ops.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "ops.image" . }}
          command: {{ toJson .Values.migrate.command }}
          envFrom:
            - secretRef:
                name: {{ required "secretName fehlt" .Values.secretName }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          {{- include "ops.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
