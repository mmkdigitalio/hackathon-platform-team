# Sollzustand von AFFiNE in staging. Image und Chart-Version kommen aus mmkdigitalio/hackathon-platform-affine
# (platform-package.yml); values.affine.nodeOptions ist der Pfad des Fehlerszenarios L11.
schemaVersion: "0.1"
upstreamRelease: v0.27.4
image: ghcr.io/toeverything/affine@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
chart:
  version: 0.1.4
sizes:
  replicas: 1
  resources:
    # Ein Knoten mit 2 vCPU / 4 GiB für die ganze Plattform: Anfrage klein, Limit für Lastspitzen
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
  volumeSize: 10Gi
values:
  affine:
    # Heap unter dem Speicherlimit halten; Fehlerszenario L11 setzt diesen Wert auf 16
    nodeOptions: --max-old-space-size=1536
