<!doctype html>
<!-- Live-Ansicht für playbook-self-heal.sh --html <verzeichnis>. Das Skript kopiert diese Datei als index.html
     und schreibt status.js bei jeder Abfrage neu; die Seite lädt status.js alle 2 Sekunden. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selbstheilung AFFiNE</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6eb; --text: #14171c; --muted: #646b76; --faint: #a3a9b3;
    --ok: #18864b; --ok-soft: #e3f4ea; --err: #c4322b; --err-soft: #fbe7e5; --run: #b86e00; --run-soft: #fff1d9;
    --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a20; --border: #2a2f38; --text: #eceff3; --muted: #9aa2ae; --faint: #5d6570;
      --ok: #3fcf7f; --ok-soft: #133524; --err: #ff6b61; --err-soft: #3a1714; --run: #ffb547; --run-soft: #3a2a0e;
      --accent: #7c9dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 32px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { margin: 6px 0 8px; font-size: 40px; line-height: 1.1; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .meta { color: var(--muted); font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  .side { text-align: right; }
  .clock { font-size: 56px; font-weight: 600; line-height: 1; }
  .pill {
    display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 15px;
    background: var(--run-soft); color: var(--run);
  }
  .pill.passed, .pill.checked { background: var(--ok-soft); color: var(--ok); }
  .pill.failed { background: var(--err-soft); color: var(--err); }
  .pill.aborted { background: var(--border); color: var(--muted); }

  .now {
    margin: 28px 0 22px; padding: 20px 24px; border-radius: 14px; background: var(--surface);
    border: 1px solid var(--border); border-left: 5px solid var(--run);
    display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: center;
  }
  .now.passed, .now.checked { border-left-color: var(--ok); }
  .now.failed { border-left-color: var(--err); }
  .now.aborted { border-left-color: var(--faint); }
  .now-label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .now-title { font-size: 26px; font-weight: 650; }
  .now-obs { color: var(--muted); grid-column: 1 / -1; min-height: 1.45em; overflow-wrap: anywhere; }
  .now-timer { grid-row: 1 / 3; grid-column: 2; font-size: 34px; font-weight: 600; color: var(--muted); }

  ol { list-style: none; margin: 0; padding: 0; position: relative; }
  ol::before { content: ""; position: absolute; left: 19px; top: 24px; bottom: 24px; width: 2px; background: var(--border); }
  li {
    position: relative; display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: start;
    padding: 12px 0;
  }
  .dot {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px;
    background: var(--surface); border: 2px solid var(--border); color: var(--faint); position: relative; z-index: 1;
  }
  li.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  li.failed .dot { background: var(--err); border-color: var(--err); color: #fff; }
  li.running .dot { border-color: var(--run); color: var(--run); background: var(--run-soft); }
  li.running .dot::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--run);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { from { opacity: .8; transform: scale(.85); } to { opacity: 0; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { li.running .dot::after { animation: none; opacity: .5; } }
  .title { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 7px; }
  li.pending .title, li.skipped .title { color: var(--muted); font-weight: 500; }
  .actor {
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); background: var(--surface);
  }
  .detail { color: var(--muted); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
  li.failed .detail { color: var(--err); }
  .time { text-align: right; padding-top: 8px; color: var(--muted); font-size: 15px; white-space: nowrap; }
  .time small { display: block; color: var(--faint); font-size: 13px; }

  footer { margin-top: 26px; color: var(--faint); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
  footer .stale { color: var(--err); font-weight: 600; }

  @media (max-width: 640px) {
    main { padding: 24px 16px; }
    h1 { font-size: 30px; }
    .side { text-align: left; }
    .clock { font-size: 40px; }
    .now { grid-template-columns: 1fr; }
    .now-timer { grid-row: auto; grid-column: 1; font-size: 24px; }
    li { grid-template-columns: 40px 1fr; }
    .time { grid-column: 2; text-align: left; padding-top: 0; }
    .time small { display: inline; margin-left: 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">Playbook Selbstheilung</div>
      <h1>AFFiNE <span id="env">· staging</span></h1>
      <div class="meta"><span id="app"></span><span id="rule"></span></div>
    </div>
    <div class="side">
      <div class="clock mono" id="clock">00:00</div>
      <div class="pill" id="result">warte auf Status …</div>
    </div>
  </header>

  <section class="now" id="now">
    <div class="now-label" id="now-label">Jetzt</div>
    <div class="now-title" id="now-title">–</div>
    <div class="now-timer mono" id="now-timer"></div>
    <div class="now-obs" id="now-obs"></div>
  </section>

  <ol id="stages"></ol>

  <footer><span id="started"></span><span id="updated"></span></footer>
</main>
<script>
  const RESULT = { running: "läuft", passed: "selbstgeheilt", checked: "Vorprüfung bestanden", failed: "gescheitert", aborted: "abgebrochen" };
  const ICON = { done: "✓", failed: "✕", skipped: "–", running: "", pending: "" };
  let status = null;

  const $ = (id) => document.getElementById(id);
  const ms = (iso) => (iso ? Date.parse(iso) : null);
  const clock = (sec) => {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };
  const hhmmss = (iso) => new Date(iso).toLocaleTimeString("de-DE");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const link = (href, text) => { const a = el("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; };

  function render() {
    if (!status) return;
    const s = status, started = ms(s.started);
    $("env").textContent = "· " + s.environment;
    $("result").textContent = RESULT[s.result] || s.result;
    $("result").className = "pill " + s.result;
    $("now").className = "now " + s.result;
    $("app").replaceChildren(...(s.appUrl ? [link(s.appUrl, s.appUrl.replace(/^https?:\/\//, ""))] : []));
    $("rule").textContent = s.rule;

    const cur = s.stages[s.current];
    if (s.result === "running") {
      $("now-label").textContent = "Jetzt · " + cur.actor;
      $("now-title").textContent = "Warte auf: " + cur.label;
      $("now-obs").textContent = s.observation || "";
    } else {
      const failedStage = s.stages.find((x) => x.state === "failed");
      $("now-label").textContent = "Ergebnis";
      $("now-title").textContent = s.result === "passed" ? "AFFiNE hat sich selbst geheilt"
        : s.result === "checked" ? "Bereit für den Durchlauf"
        : (failedStage ? failedStage.label + ": " : "") + RESULT[s.result];
      $("now-obs").textContent = failedStage ? failedStage.detail : s.result === "passed"
        ? "Alarm, Reparatur durch den Agenten und Wiederherstellung ohne menschlichen Eingriff" : "";
    }

    const list = $("stages");
    list.replaceChildren(...s.stages.map((st) => {
      const li = el("li", st.state);
      li.append(el("div", "dot", ICON[st.state]));
      const body = el("div");
      const title = el("div", "title", st.label);
      title.append(el("span", "actor", st.actor));
      body.append(title);
      if (st.detail || st.link) {
        const d = el("div", "detail", st.detail);
        if (st.link) { d.append(" "); d.append(link(st.link, "öffnen ↗")); }
        body.append(d);
      }
      li.append(body);
      const t = el("div", "time mono");
      if (st.at && st.state !== "skipped") {
        t.textContent = "+" + clock((ms(st.at) - started) / 1000);
        t.append(el("small", null, "Dauer " + clock((ms(st.at) - ms(st.startedAt)) / 1000)));
      } else if (st.state === "running" && st.startedAt) {
        t.dataset.since = st.startedAt;
      }
      li.append(t);
      return li;
    }));

    $("started").textContent = "Start " + hhmmss(s.started);
    tick();
  }

  function tick() {
    if (!status) return;
    const s = status, now = Date.now(), end = s.finished ? ms(s.finished) : now;
    $("clock").textContent = clock((end - ms(s.started)) / 1000);
    const cur = s.stages[s.current];
    $("now-timer").textContent = s.result === "running" && cur.startedAt ? clock((now - ms(cur.startedAt)) / 1000) : "";
    document.querySelectorAll("[data-since]").forEach((e) => { e.textContent = clock((now - ms(e.dataset.since)) / 1000); });
    const age = (now - ms(s.updated)) / 1000, up = $("updated");
    up.textContent = "Stand " + hhmmss(s.updated) + (s.result === "running" && age > 180 ? " · keine Aktualisierung seit " + clock(age) : "");
    up.className = s.result === "running" && age > 180 ? "stale" : "";
  }

  function load() {
    const sc = document.createElement("script");
    sc.src = "status.js?" + Date.now();
    sc.onload = () => { sc.remove(); if (window.__playbook) { status = window.__playbook; render(); } };
    sc.onerror = () => sc.remove();
    document.head.append(sc);
  }
  load();
  setInterval(load, 2000);
  setInterval(tick, 1000);
</script>
</body>
</html>
