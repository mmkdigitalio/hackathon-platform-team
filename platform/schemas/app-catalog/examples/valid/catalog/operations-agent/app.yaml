schemaVersion: "0.1"
appId: operations-agent
source:
  repository: mmkdigitalio/hackathon-platform-team
chart:
  acr:
    repository: helm/operations-agent
ingress:
  service: operations-agent
  port: 80
dataBlocks: []
secrets:
