    CHECK_PATH: /healthz
runbook:
  repository: mmkdigitalio/hackathon-platform-team
  path: platform/operations/agent
  commit: 0123456789abcdef0123456789abcdef01234567
allowedActions: []
dataProcedures:
  migration: Helm-Hook-Job ops migrate (pre-install,pre-upgrade) aus dem Agenten-Chart
  backup: Datenbank operations über die Sicherung des Foundation-Servers
  restore: not-applicable
