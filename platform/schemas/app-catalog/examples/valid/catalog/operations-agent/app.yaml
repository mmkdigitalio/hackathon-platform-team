  POSTGRES_USER: foundation:postgresAdminUser
  POSTGRES_PASSWORD: foundation:postgresAdminPassword
  POSTGRES_DATABASE: foundation:postgresOperationsDatabase
availability:
  path: /healthz
smokeTest:
  image: acr:platform/smoke-http@sha256:bf7d3551822d2ea596db4f8f78c891f42da60635d0ab8e626d2c82a44be2dfa7
